# Copy once to battery_planner/user_config.yaml (NAS only, gitignored) and edit.
# Every value that differs between installations lives here and nowhere else.

# Provider price coefficients. Consumption and injection are never symmetric.
#
# CAVEAT - the consumption price must be ALL-IN. The planner compares it with
# injection prices (arbitrage) and tests it against zero (paid-to-charge). Your supplier line
# (market x multiplier + offset) is NOT what you pay per kWh: Belgian bills add
# per-kWh network costs and taxes that apply to every kWh taken from the grid,
# plus VAT. Leave them out and "buy now, export later" and "paid to charge"
# look profitable when they are not. Fold them into the offset:
#
#   fees per kWh = (annual EUR of each per-kWh bill line) / (annual kWh offtake)
#   all-in price = (market x m + o + fees) x (1 + VAT)
#   multiplier   = m x (1 + VAT)
#   offset       = (o + fees) x (1 + VAT)
#
# Per-kWh lines on a Fluvius Imewo bill for 2025-26 (EUR/kWh, VAT excluded;
# YOUR distribution operator and year differ - compute your own from your bill):
#   green certificates 0.0110, CHP certificates 0.0039, distribution 0.0575,
#   energy contribution 0.0019, excise 0.0475  ->  fees = 0.1218
# Not per-kWh, so NOT part of the offset: data management (fixed) and the
# capacity tariff (billed on your monthly peak).
# Worked example with m 1.07, o 0.007 and 6 % VAT:
#   multiplier 1.07 x 1.06 = 1.1342, offset (0.007 + 0.1218) x 1.06 = 0.1366
# Check whether your supplier coefficients already include VAT before applying it.
# Injection: private households are normally not charged VAT or these fees on
# injection, so the injection coefficients below stay as the supplier states.
prices:
  consumption_multiplier: 1.07    # supplier coefficient only; see the caveat above
  consumption_offset: 0.007       # supplier coefficient only; see the caveat above
  injection_multiplier: 0.94
  injection_offset: -0.011      # negative: injection price goes negative while
                                # the market price is still positive
  entity: sensor.entso_prices_average_electricity_price
                                # The HA entity that carries the price list in an
                                # attribute. Find yours in Developer Tools ->
                                # States: filter "entso" and open the one whose
                                # attributes include a list of {time, price}.
                                # CONFIRMED on a live entsoe custom integration
                                # install (entries look like {'time':
                                # '2026-10-02 00:00:00+02:00', 'price': 0.19622},
                                # 15-minute steps, EUR/kWh). The sibling
                                # sensor.entso_prices_current_electricity_market_price
                                # did NOT carry the list there.
  attribute: prices             # the attribute holding that list

battery:
  capacity_kwh: CHANGE_ME       # REQUIRED - no sensible default (number, kWh)
  reserve_percent: 10.0         # never planned below
  max_charge_kw: 5.0            # binds PER BLOCK, independent of capacity
  max_discharge_kw: 5.0
  round_trip_efficiency: 0.90   # gates arbitrage and the solar-hold decision

# The roof (position, tilt, direction, kWp) is NOT configured here: it lives only
# in forecast_solar_url in secrets.yaml. See README, Install step 5.
solar:
  forecast_entity: sensor.forecast_solar_estimate
                                # The REST sensor from configuration.yaml that
                                # carries the per-period forecast. UNCONFIRMED
                                # on the live install: check Developer Tools ->
                                # States and set the real name here.
  forecast_attribute: watt_hours_period
                                # attribute holding {timestamp: Wh} per period

# Belgian capaciteitstarief, billed on grid offtake only.
capacity_tariff:
  enabled: true
  billing_floor_kw: 2.5         # no saving below this
  guard_interval_seconds: 30
  stay_under_percent: 80        # > 0 and <= 100. Charging from the grid must
                                # stay under this percentage of the ceiling
                                # (month peak, floored at billing_floor_kw).
                                # 80 with the 2.5 kW floor: do not grid-charge
                                # if the quarter-hour looks like passing 2.0 kW.
                                # Peak shaving still defends the real ceiling.
                                # 100 = charge right up to the ceiling.
  quarter_hour_average_mode: auto   # auto | running | accumulating
  offtake_sensor: sensor.slimmelezer_power_consumed
                                # the meter's NETTED three-phase total; never
                                # sum the per-phase sensors
  quarter_hour_average_sensor: sensor.slimmelezer_huidig_kwartiervermogen
                                # the meter's 1-0:1.4.0 quarter-hour average
  month_peak_sensor: sensor.slimmelezer_maandpiek
                                # the meter's 1-0:1.6.0 month peak
                                # NOTE: the peak guard's trigger on
                                # sensor.slimmelezer_power_consumed is fixed in
                                # pyscript/peak_guard.py. If you rename the
                                # offtake sensor the guard still READS the new
                                # name, but only on its 30 s tick.

# Expected household consumption per block, averaged from recent history.
usage:
  history_weeks: 4              # trailing window
  grouping: same_weekday        # same_weekday | day_type
                                # same_weekday: a Wednesday block = mean of the
                                #   last 4 Wednesdays (faithful to routines)
                                # day_type: a Wednesday block = mean over every
                                #   weekday in the window; Saturday and Sunday
                                #   pool as weekend days (smoother, fills faster)
  recency_weighting: linear     # linear | none
                                # linear: newer weeks count more, so changes in
                                #   routine show up sooner. With history_weeks 4
                                #   the last week weighs 4, the week before 3,
                                #   then 2, then 1 (weight = history_weeks -
                                #   weeks ago; missing weeks just drop out)
                                # none: plain mean, every day counts equally

# Energy history: the planner records its own 15-minute energy history.
# Counters must be CUMULATIVE energy in kWh (Wh and MWh are converted).
# Several counters per quantity are summed (tariff 1 + tariff 2). Every list
# is optional; an empty list means "not available" and that quantity is
# recorded as null. See the README, section "Energy history".
history:
  enabled: true
  sensors:
    import:                     # energy taken from the grid
      - sensor.slimmelezer_energy_consumed_tariff_1
      - sensor.slimmelezer_energy_consumed_tariff_2
    export:                     # energy injected into the grid
      - sensor.slimmelezer_energy_produced_tariff_1
      - sensor.slimmelezer_energy_produced_tariff_2
    solar: []                   # PV production counter(s), e.g. from the inverter
    battery_charge: []          # energy into the battery
    battery_discharge: []       # energy out of the battery
    load: []                    # household consumption counter, if you have one
                                # Usage history (and so grid charging) unlocks
                                # with `load`, or with solar + battery_charge +
                                # battery_discharge all configured.

# Daily report: shortly after midnight the planner writes a readable summary
# of the day that just ended (decisions and energy) next to the energy
# history, as battery_planner/history/report-YYYY-MM-DD.md. See the README,
# section "Daily report". Missing days of the last week are filled in; an
# existing report is never rewritten.
report:
  enabled: true

timing:
  block_minutes: 15
  evaluation_interval_minutes: 5
  forecast_retry_minutes: 10
  solar_cache_stale_minutes: 120
  usage_cache_stale_minutes: 2880

alerts:
  address: CHANGE_ME@example.com   # REQUIRED - where halt alerts are sent
                                   # (same address as smtp_recipient in HA's secrets.yaml)
  notify_service: battery_alert      # name of the HA notify service (notify.<name>);
                                   # lowercase letters, digits, underscore. Must match the
                                   # notifier in configuration.yaml (or one made in the UI)
  realert_minutes: 60
  # Two capacity-tariff e-mails, both sent through the same notify service:
  peak_enabled: true               # NOTICE AFTER the fact: this month's meter peak (1-0:1.6.0)
                                   # went above capacity_tariff.billing_floor_kw. One mail for the
                                   # first crossing of a month, one more for each new peak at least
                                   # 0.05 kW higher. Includes an ESTIMATED cost effect.
  peak_warning_enabled: true       # WARNING BEFORE: this quarter-hour is probably going to exceed
                                   # the ceiling (month peak, never below the billing floor).
                                   # Evaluated by the peak guard.
  peak_warning_min_interval_minutes: 60   # at most one warning per this many minutes (integer >= 1);
                                   # and never more than one per quarter-hour
  peak_warning_ticks: 2            # consecutive guard evaluations (30 s apart) that must project
                                   # above the ceiling before warning (integer >= 1; 1 = warn on
                                   # the first). Fewer = earlier but noisier

# Which inverter driver to use. Selects pyscript/modules/inverter_<type>.py.
# Decisions are ALWAYS logged first, whatever the driver.
inverter:
  type: logging                    # logging (default; nothing or "none" means the same):
                                   #   log only, transmit nothing.
                                   # Any other value loads that driver file, which sends
                                   #   REAL COMMANDS to your inverter. You are responsible
                                   #   for the driver you enable. Lowercase letters,
                                   #   digits, underscore.
  resend_minutes: 15               # the driver gets an UNCHANGED command again only after this
                                   # many minutes (whole number, 0 or more). A changed command
                                   # (other action, or power differing by 0.01 kW) is sent at once.
                                   # 0 = send on every call. The decision log line is written
                                   # every cycle regardless. No effect with the logging driver.

timezone: Europe/Brussels
