# Template for Home Assistant's secrets.yaml. PLACEHOLDERS ONLY.
#
# Copy the keys below into your real secrets.yaml (which is gitignored and must
# never be committed) and replace the values. They are referenced from
# configuration.yaml with !secret, so configuration.yaml itself is never edited.
#
# =========================== forecast.solar ===========================
# URL path order: lat/lon/declination/azimuth/kwp
# Azimuth: 0 = south, negative = east (so -10 is ten degrees east of south).
# The roof lives only in this URL; user_config.yaml has no roof settings.
# The values below are generic example coordinates (Brussels); use your own.
forecast_solar_url: "https://api.forecast.solar/estimate/50.85/4.35/35/0/5.0"

# =========================== alert e-mail ===========================
# Per-account values (always required):
smtp_sender: your.account@example.com            # the account that sends
smtp_password: xxxx-xxxx-xxxx-xxxx-placeholder   # app password (NOT the normal account password)
smtp_recipient: you@example.com                  # same as alerts.address in user_config.yaml

# Provider settings: keep EXACTLY ONE preset block uncommented, the rest commented.
#
# NOTE: these hostnames and ports come from the providers' public documentation
# as known at the time of writing. They have NOT been verified against live
# accounts. Confirm them with your provider before relying on them.

# --- PRESET: Gmail (needs 2-step verification and an App Password) ---
smtp_server: smtp.gmail.com
smtp_port: 587
smtp_encryption: starttls
# --- END PRESET: Gmail ---

# --- PRESET: Outlook / Microsoft 365 ---
# Basic-auth SMTP is disabled on many Microsoft accounts, so this may not work.
# smtp_server: smtp.office365.com
# smtp_port: 587
# smtp_encryption: starttls
# --- END PRESET: Outlook ---

# --- PRESET: Yahoo (needs an app password) ---
# smtp_server: smtp.mail.yahoo.com
# smtp_port: 587
# smtp_encryption: starttls
# --- END PRESET: Yahoo ---

# --- PRESET: iCloud (needs an app-specific password) ---
# smtp_server: smtp.mail.me.com
# smtp_port: 587
# smtp_encryption: starttls
# --- END PRESET: iCloud ---

# --- PRESET: CUSTOM (any other provider) ---
# smtp_encryption is one of: starttls | tls | none
# Typical ports: 587 (starttls), 465 (tls), 25 (none)
# smtp_server: smtp.example.com
# smtp_port: 587
# smtp_encryption: starttls
# --- END PRESET: CUSTOM ---
