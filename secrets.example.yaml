# Template for Home Assistant's secrets.yaml. PLACEHOLDERS ONLY.
#
# Copy the keys below into your real secrets.yaml (which is gitignored and must
# never be committed) and replace the values. They are referenced from
# configuration.yaml with !secret.
#
# Gmail needs 2-step verification on the account plus an App Password
# (Google Account -> Security -> App passwords). Use the App Password below,
# not the account password.

smtp_sender: your.account@example.com            # the Gmail account that sends
smtp_password: xxxx-xxxx-xxxx-xxxx-placeholder   # the Gmail App Password
smtp_recipient: you@example.com                  # same as alerts.address in user_config.yaml
