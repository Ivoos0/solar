# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ---------------------------------------------------------------------------
# Price-aware battery planner
# ---------------------------------------------------------------------------

# pyscript (installed via HACS). allow_all_imports is needed only by the
# adapter (yaml/json parsing); the pure core under pyscript/modules/ is
# importable regardless.
pyscript:
  allow_all_imports: true
  hass_is_global: true

# forecast.solar REST sensor (the built-in integration has no YAML form). Free
# tier, no API key, one plane. The whole URL (including your roof parameters)
# lives in HA secrets.yaml as forecast_solar_url, so this block never needs
# editing. See secrets.example.yaml.
# scan_interval 3600 = 1 request/hour (the free tier allows about 12 per hour).
# The payload rides on the watt_hours_period attribute; state is only a summary
# (states over 255 chars are truncated).
rest:
  - resource: !secret forecast_solar_url
    scan_interval: 3600
    sensor:
      - name: "Forecast Solar Estimate"
        value_template: "{{ value_json.result.watt_hours_day.values() | list | first }}"
        json_attributes_path: "$.result"
        json_attributes:
          - watt_hours_period
        unit_of_measurement: "Wh"

# Capacity-tariff sensors (SlimmeLezer reflash). All report kW with device_class
# power, so no unit conversion is needed:
#   sensor.slimmelezer_huidig_kwartiervermogen           1-0:1.4.0  running quarter-hour average
#   sensor.slimmelezer_maandpiek                         1-0:1.6.0  this month's peak (level to defend)
#   sensor.slimmelezer_gemiddelde_maandpiek_13_maanden   13-month average (what the fee is billed on)
#   sensor.slimmelezer_power_consumed                    netted total
# No helper sensors are needed: the meter's own registers are
# authoritative. Do not add them.
#
# Whether the quarter-hour sensor accumulates (energy so far / full 15 min) or
# reports a true running average is detected by the planner from normal
# household consumption. Pin it with capacity_tariff.quarter_hour_average_mode
# once you know the answer (default: auto).
#
# The planner reads two other entities; check their names on your install
# (Developer Tools -> States):
#   1. sensor.forecast_solar_estimate  (created above)
#   2. The ENTSO-e price entity (prices.entity in user_config.yaml) and the
#      attribute holding the forward price series (prices.attribute).
#   A mismatch shows up as the planner halting every cycle with "price data
#   unavailable" while the sensor visibly has data.

# ---------------------------------------------------------------------------
# Halt-alert e-mail (alerts.notify_service in user_config.yaml, default battery_alert)
# ---------------------------------------------------------------------------
# The planner sends its "no price data" alert through notify.<name>, where <name>
# is alerts.notify_service. This defines that notifier. Provider, credentials and
# addresses ALL come from Home Assistant's secrets.yaml (gitignored); nothing here
# is provider-specific, so this block never needs editing. See secrets.example.yaml
# for ready-made provider presets.
#
# UNVERIFIED: the SMTP YAML platform may be deprecated in recent HA releases.
# If Home Assistant reports it as unsupported, create the notifier through the
# UI instead and put its service name in alerts.notify_service (docs/alerts-and-sensors.md,
# "Alert e-mails").
notify:
  - name: battery_alert            # must equal alerts.notify_service
    platform: smtp
    server: !secret smtp_server
    port: !secret smtp_port
    encryption: !secret smtp_encryption
    sender: !secret smtp_sender
    username: !secret smtp_sender
    password: !secret smtp_password
    recipient: !secret smtp_recipient
    sender_name: "Battery planner"
