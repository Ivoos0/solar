# Optional example: simulate what dynamic pricing would cost you.
#
# This file is NOT loaded by configuration.yaml and the battery planner does not
# use anything in it. It is a personal-finance helper: it turns your meter's
# energy counters into running "simulated dynamic cost / compensation" totals
# plus daily and monthly meters, so you can compare them with your real bill.
#
# BEFORE USING IT
#   * Edit the price formulas to your own contract. The coefficients below
#     (consumption: market price * 1.07 + 0.007, injection: market price * 0.94
#     - 0.011, EUR/kWh) are only an example. The planner's own prices are set in
#     battery_planner/user_config.yaml (see the prices section); keep both in
#     step if you want the simulation to match what the planner assumes.
#   * sensor.entso_prices_current_electricity_market_price comes from the
#     ENTSO-e integration; the sensor.slimmelezer_energy_* counters come from the
#     SlimmeLezer. Rename them if yours differ.
#
# HOW TO INCLUDE IT
#   Copy this file to <ha-config>/examples/cost_simulation.yaml, then add this to
#   your configuration.yaml (Home Assistant "packages" merge the template: and
#   utility_meter: blocks with the ones you already have; this package include
#   is untested):
#       homeassistant:
#         packages:
#           cost_simulation: !include examples/cost_simulation.yaml
#   Restart Home Assistant. To remove it, delete that line.

template:
  - sensor:
      # Adjust the entity name below if your ENTSO-e integration names the
      # market price sensor differently.
      - name: "Dynamic Consumption Price"
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        state: >
          {% set belpex = states('sensor.entso_prices_current_electricity_market_price') | float(none) %}
          {% if belpex is none %}
            unknown
          {% else %}
            {{ (belpex * 1.07 + 0.007) | round(4) }}
          {% endif %}
        availability: >
          {{ states('sensor.entso_prices_current_electricity_market_price') not in ['unknown', 'unavailable', 'none'] }}

      - name: "Dynamic Injection Price"
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        state: >
          {% set belpex = states('sensor.entso_prices_current_electricity_market_price') | float(none) %}
          {% if belpex is none %}
            unknown
          {% else %}
            {{ (belpex * 0.94 - 0.011) | round(4) }}
          {% endif %}
        availability: >
          {{ states('sensor.entso_prices_current_electricity_market_price') not in ['unknown', 'unavailable', 'none'] }}
  - sensor:
      - name: "Energy Consumed Total"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ (states('sensor.slimmelezer_energy_consumed_tariff_1') | float(0) +
              states('sensor.slimmelezer_energy_consumed_tariff_2') | float(0)) | round(3) }}

      - name: "Energy Produced Total"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ (states('sensor.slimmelezer_energy_produced_tariff_1') | float(0) +
              states('sensor.slimmelezer_energy_produced_tariff_2') | float(0)) | round(3) }}
  - trigger:
      - platform: state
        entity_id: sensor.energy_consumed_total
    sensor:
      - name: "Simulated Dynamic Cost Total"
        unique_id: simulated_dynamic_cost_total
        unit_of_measurement: "EUR"
        device_class: monetary
        state_class: total_increasing
        state: >
          {% set prev_total = states('sensor.simulated_dynamic_cost_total') | float(0) %}
          {% set old_kwh = trigger.from_state.state | float(-1) %}
          {% set new_kwh = trigger.to_state.state | float(-1) %}
          {% set price = states('sensor.dynamic_consumption_price') | float(-1) %}
          {% if old_kwh < 0 or new_kwh < 0 or price < -1 %}
            {{ prev_total }}
          {% else %}
            {% set delta_kwh = new_kwh - old_kwh %}
            {% if delta_kwh > 0 and delta_kwh < 10 %}
              {{ (prev_total + delta_kwh * price) | round(4) }}
            {% else %}
              {{ prev_total }}
            {% endif %}
          {% endif %}

  - trigger:
      - platform: state
        entity_id: sensor.energy_produced_total
    sensor:
      - name: "Simulated Dynamic Compensation Total"
        unique_id: simulated_dynamic_compensation_total
        unit_of_measurement: "EUR"
        device_class: monetary
        state_class: total_increasing
        state: >
          {% set prev_total = states('sensor.simulated_dynamic_compensation_total') | float(0) %}
          {% set old_kwh = trigger.from_state.state | float(-1) %}
          {% set new_kwh = trigger.to_state.state | float(-1) %}
          {% set price = states('sensor.dynamic_injection_price') | float(-1) %}
          {% if old_kwh < 0 or new_kwh < 0 %}
            {{ prev_total }}
          {% else %}
            {% set delta_kwh = new_kwh - old_kwh %}
            {% if delta_kwh > 0 and delta_kwh < 10 %}
              {{ (prev_total + delta_kwh * price) | round(4) }}
            {% else %}
              {{ prev_total }}
            {% endif %}
          {% endif %}

utility_meter:
  daily_dynamic_cost:
    source: sensor.simulated_dynamic_cost_total
    cycle: daily
    name: "Simulated Dynamic Cost Daily"

  daily_dynamic_compensation:
    source: sensor.simulated_dynamic_compensation_total
    cycle: daily
    name: "Simulated Dynamic Compensation Daily"

  monthly_dynamic_cost:
    source: sensor.simulated_dynamic_cost_total
    cycle: monthly
    name: "Simulated Dynamic Cost Monthly"

  monthly_dynamic_compensation:
    source: sensor.simulated_dynamic_compensation_total
    cycle: monthly
    name: "Simulated Dynamic Compensation Monthly"
